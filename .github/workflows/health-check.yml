name: HIRECAR Health Check

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run health check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          SCRIPT_PATH="HC-WORKSTATIONS/WS4-EXECUTION-MONITOR/CFG-HC-0403_HealthCheck_v1.0.0.sh"
          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "Health check script not found: $SCRIPT_PATH"
            exit 1
          fi
          chmod +x "$SCRIPT_PATH"
          bash "$SCRIPT_PATH"

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"🔴 HIRECAR Health Check FAILED — see GitHub Actions for details"}' \
              "$SLACK_WEBHOOK_URL"
          fi
